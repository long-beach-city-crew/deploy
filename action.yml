name: "Deploy"
description: "Deploy to proxmox"

inputs:
  api_host:
    type: string
    required: true
  api_key:
    type: string
    required: true
  target:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: Prepare payload
      id: payload
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        REPO: ${{ github.repository }}
      run: |
        payload=$(jq -nc --arg repo "$REPO" --arg target "$TARGET" \
          '{repo: $repo, target: $target}')
        echo "json=${payload}" >> "$GITHUB_OUTPUT"

    - name: Trigger deploy
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        API_HOST: ${{ inputs.api_host }}
        PAYLOAD: ${{ steps.payload.outputs.json }}
      run: |
        curl --silent --show-error --fail-with-body -X POST "https://${API_HOST}/deploy" \
          -H "X-API-Key: ${API_KEY}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}"
