name: "Deploy"
description: "Deploy to proxmox"

inputs:
  api_host:
    type: string
    required: true
  api_key:
    type: string
    required: true
  target:
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: Info
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        API_HOST: ${{ inputs.api_host }}
        TARGET: ${{ inputs.target }}
      run: |
        echo "REPO: ${{ github.repository }}"
        echo "HOST: ${API_HOST}"
        echo "KEY: ${API_KEY}"

    - name: Trigger deploy
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        API_HOST: ${{ inputs.api_host }}
        TARGET: ${{ inputs.target }}
      run: |
        # curl -fsS -X POST "https://${API_HOST}/deploy" \
        curl --silent --show-error --fail-with-body -X POST "https://${API_HOST}/deploy" \
          -H "X-API-Key: ${API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"repo":"${{ github.repository }}", "target":"${TARGET}"}'
